name: Production health check

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  # Pure node probes — no npm install (avoids false Telegram on npm ci failure).
  probes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BG_SYNC_BASE: ${{ vars.BG_SYNC_BASE || 'https://recenze-ceny.cz' }}
      HOOK_SECRET: ${{ secrets.HOOK_SECRET }}
      MAX_MISSING_CONTENT: "2"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      OPS_TELEGRAM_STATE_PATH: ${{ github.workspace }}/.ops-telegram-state/state.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Monitor content pipeline
        run: node scripts/monitor-content-pipeline.mjs --base="${BG_SYNC_BASE}" --max-missing-content="${MAX_MISSING_CONTENT}"

      - name: Check sitemap health
        run: node scripts/check-sitemap-health.mjs --base="${BG_SYNC_BASE}" --timeout-ms=20000

      - name: Run public smoke test
        run: node scripts/smoke-cz.mjs --base="${BG_SYNC_BASE}"

      - name: Telegram alert on probe failure
        if: failure()
        run: node scripts/ops-telegram-digest.mjs --base="${BG_SYNC_BASE}" --health-fail

  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BG_SYNC_BASE: ${{ vars.BG_SYNC_BASE || 'https://recenze-ceny.cz' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run SEO meta unit tests
        run: npm run test:seo-meta-cz

      - name: Run SEO preflight
        run: npm run seo:preflight -- --base="${BG_SYNC_BASE}"

      - name: Telegram on SEO check failure
        if: failure()
        run: |
          node scripts/notify-telegram.mjs \
            --title="recenze-ceny.cz: SEO health-check не прошёл" \
            --body="Упали SEO unit tests / preflight в GitHub Actions (не smoke сайта). Проверьте логи прогона."
