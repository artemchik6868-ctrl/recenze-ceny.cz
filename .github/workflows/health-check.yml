name: Production health check

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  # Pure node probes + SEO scripts without full `npm ci` (ci install fails in ~1s on GHA).
  probes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BG_SYNC_BASE: ${{ vars.BG_SYNC_BASE || 'https://recenze-ceny.cz' }}
      HOOK_SECRET: ${{ secrets.HOOK_SECRET }}
      MAX_MISSING_CONTENT: "2"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      OPS_TELEGRAM_STATE_PATH: ${{ github.workspace }}/.ops-telegram-state/state.json
      HEALTH_LOG_DIR: ${{ github.workspace }}/.health-logs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare probe log dir
        run: mkdir -p "$HEALTH_LOG_DIR"

      # Avoid hourly `npx --yes tsx` registry flake — local install + npm cache only.
      - name: Cache npm for tsx install
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: health-npm-tsx-4.20.3-${{ runner.os }}-node22

      - name: Install tsx (SEO meta only)
        run: npm install --no-save --no-audit --no-fund --no-package-lock tsx@4.20.3

      - name: Monitor content pipeline
        id: pipeline
        run: |
          set -o pipefail
          node scripts/monitor-content-pipeline.mjs --base="${BG_SYNC_BASE}" --max-missing-content="${MAX_MISSING_CONTENT}" --self-heal-drain \
            2>&1 | tee "${HEALTH_LOG_DIR}/pipeline.log"

      - name: Check sitemap health
        id: sitemap
        run: |
          set -o pipefail
          node scripts/check-sitemap-health.mjs --base="${BG_SYNC_BASE}" --timeout-ms=20000 \
            2>&1 | tee "${HEALTH_LOG_DIR}/sitemap.log"

      - name: Run public smoke test
        id: smoke
        run: |
          set -o pipefail
          node scripts/smoke-cz.mjs --base="${BG_SYNC_BASE}" \
            2>&1 | tee "${HEALTH_LOG_DIR}/smoke.log"

      - name: SEO meta unit tests
        id: seo_meta
        run: |
          set -o pipefail
          node ./node_modules/tsx/dist/cli.mjs scripts/test-seo-meta-cz.mjs \
            2>&1 | tee "${HEALTH_LOG_DIR}/seo_meta.log"

      - name: SEO preflight
        id: seo_preflight
        run: |
          set -o pipefail
          node scripts/seo-preflight.mjs --base="${BG_SYNC_BASE}" \
            2>&1 | tee "${HEALTH_LOG_DIR}/seo_preflight.log"

      - name: Telegram alert on probe failure
        if: failure()
        env:
          # First failed step wins — surfaces real probe cause (not warehouse facts).
          HEALTH_FAILED_STEP: ${{ steps.pipeline.outcome == 'failure' && 'Monitor content pipeline' || steps.sitemap.outcome == 'failure' && 'Check sitemap health' || steps.smoke.outcome == 'failure' && 'Run public smoke test' || steps.seo_meta.outcome == 'failure' && 'SEO meta unit tests' || steps.seo_preflight.outcome == 'failure' && 'SEO preflight' || 'unknown probe step' }}
          HEALTH_FAILED_LOG: ${{ steps.pipeline.outcome == 'failure' && 'pipeline' || steps.sitemap.outcome == 'failure' && 'sitemap' || steps.smoke.outcome == 'failure' && 'smoke' || steps.seo_meta.outcome == 'failure' && 'seo_meta' || steps.seo_preflight.outcome == 'failure' && 'seo_preflight' || '' }}
        run: |
          if [ -n "${HEALTH_FAILED_LOG}" ] && [ -f "${HEALTH_LOG_DIR}/${HEALTH_FAILED_LOG}.log" ]; then
            export HEALTH_PROBE_LOG_SNIPPET="$(tail -n 15 "${HEALTH_LOG_DIR}/${HEALTH_FAILED_LOG}.log" | head -c 1800)"
          fi
          node scripts/ops-telegram-digest.mjs --base="${BG_SYNC_BASE}" --health-fail

  # Backup blog ingest: blog-ingest.yml has NEVER received a schedule event on this
  # repo (0 runs since creation). health-check DOES get schedules — piggyback here.
  # Once per UTC day (not hour==08): health-check fires irregularly and may miss 08.
  blog_ingest:
    # schedule = daily automation; workflow_dispatch = manual ops/test of the backup path
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      AI_GATEWAY_URL: ${{ vars.AI_GATEWAY_URL || 'https://openrouter.ai/api/v1/chat/completions' }}
      BLOG_AI_MODEL: ${{ vars.BLOG_AI_MODEL || 'poolside/laguna-s-2.1:free' }}
      BLOG_AI_MODELS: ${{ vars.BLOG_AI_MODELS || 'poolside/laguna-s-2.1:free,openai/gpt-oss-20b:free,nvidia/nemotron-3-nano-30b-a3b:free' }}
      SITE_URL: https://recenze-ceny.cz
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      GOOGLE_INDEXING_SA_JSON: ${{ secrets.GOOGLE_INDEXING_SA_JSON }}
    steps:
      - name: UTC day key
        id: day
        run: echo "d=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Already ran today?
        id: gate
        uses: actions/cache@v4
        with:
          path: .blog-ingest-day-marker
          key: blog-ingest-${{ steps.day.outputs.d }}

      - uses: actions/checkout@v4
        if: steps.gate.outputs.cache-hit != 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.cache-hit != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.cache-hit != 'true'
        run: npm install --no-audit --no-fund

      - name: Run blog ingest
        if: steps.gate.outputs.cache-hit != 'true'
        run: |
          echo "Backup blog-ingest via health-check schedule (day=${{ steps.day.outputs.d }})"
          npx tsx scripts/blog-ingest.ts --limit=3

      - name: Notify Telegram
        if: always() && steps.gate.outputs.cache-hit != 'true'
        run: node scripts/notify-blog-ingest.mjs

      - name: Mark day done
        if: steps.gate.outputs.cache-hit != 'true' && success()
        run: |
          mkdir -p .blog-ingest-day-marker
          date -u > .blog-ingest-day-marker/done
