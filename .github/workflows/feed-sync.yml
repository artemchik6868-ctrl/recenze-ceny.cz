# Manual CPA feed ingest (keeps Worker free of partner pagination).
# Daily ingest is health-check.yml job feed_sync — GitHub never scheduled this workflow
# (0 runs, same as blog-ingest.yml). npm run sync:feeds → workflow_dispatch.
# Shares cache key feed-sync-YYYY-MM-DD and concurrency group feed-sync with health-check.
# workflow_dispatch always runs (manual retry, bypasses the day cache).
name: Feed sync

on:
  workflow_dispatch:

concurrency:
  group: feed-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
      CPAGETTI_API_TOKEN: ${{ secrets.CPAGETTI_API_TOKEN }}
      ADCOMBO_API_KEY: ${{ secrets.ADCOMBO_API_KEY }}
      SHAKES_API_KEY: ${{ secrets.SHAKES_API_KEY }}
      M1_TOP_API_KEY: ${{ secrets.M1_TOP_API_KEY }}
      M1_TOP_WEBMASTER_ID: ${{ secrets.M1_TOP_WEBMASTER_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FEED_SYNC_LOCK_HOLDER: gha-${{ github.run_id }}
    steps:
      - name: UTC day key
        id: day
        run: echo "d=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Already ran today?
        id: gate
        uses: actions/cache@v4
        with:
          path: .feed-sync-day-marker
          key: feed-sync-${{ steps.day.outputs.d }}

      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.cache-hit != 'true'

      - uses: actions/setup-node@v4
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.cache-hit != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.cache-hit != 'true'
        run: npm install --no-audit --no-fund

      - name: Sync CPA feeds
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.cache-hit != 'true'
        run: npx tsx scripts/sync-feeds-local.ts

      - name: Notify Telegram
        if: always() && (github.event_name == 'workflow_dispatch' || steps.gate.outputs.cache-hit != 'true')
        run: node scripts/notify-feed-sync.mjs

      - name: Release feed_sync_lock if still held
        if: always() && (github.event_name == 'workflow_dispatch' || steps.gate.outputs.cache-hit != 'true')
        continue-on-error: true
        run: node scripts/release-feed-sync-lock.mjs

      - name: Mark day done
        if: (github.event_name == 'workflow_dispatch' || steps.gate.outputs.cache-hit != 'true') && success()
        run: |
          mkdir -p .feed-sync-day-marker
          date -u > .feed-sync-day-marker/done
