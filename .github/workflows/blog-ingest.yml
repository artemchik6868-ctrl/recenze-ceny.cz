name: Blog ingest

# Daily offline RSS → LLM rewrite → Supabase blog_posts (keeps Worker free).
# GitHub schedule is best-effort and often drops new/daily workflows; health-check
# also triggers ingest at 08 UTC as a backup (see health-check.yml).
on:
  schedule:
    # Primary daily window (UTC). On this repo this workflow has never received a
    # schedule event (GitHub drops it); real delivery is via health-check.yml backup.
    - cron: "37 8 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max posts to insert this run"
        required: false
        default: "3"
      draft:
        description: "Insert as draft (true/false)"
        required: false
        default: "false"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      AI_GATEWAY_URL: ${{ vars.AI_GATEWAY_URL || 'https://openrouter.ai/api/v1/chat/completions' }}
      BLOG_AI_MODEL: ${{ vars.BLOG_AI_MODEL || 'poolside/laguna-s-2.1:free' }}
      BLOG_AI_MODELS: ${{ vars.BLOG_AI_MODELS || 'poolside/laguna-s-2.1:free,openai/gpt-oss-20b:free,nvidia/nemotron-3-nano-30b-a3b:free' }}
      SITE_URL: https://recenze-ceny.cz
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run blog ingest
        id: ingest
        run: |
          LIMIT="${{ github.event.inputs.limit }}"
          if [ -z "$LIMIT" ]; then LIMIT=3; fi
          DRAFT="${{ github.event.inputs.draft }}"
          if [ -z "$DRAFT" ]; then DRAFT=false; fi
          ARGS="--limit=${LIMIT}"
          if [ "$DRAFT" = "true" ]; then ARGS="$ARGS --draft"; fi
          echo "Running blog-ingest $ARGS (event=${{ github.event_name }} schedule=${{ github.event.schedule }})"
          npx tsx scripts/blog-ingest.ts $ARGS

      - name: Notify Telegram
        if: always()
        run: node scripts/notify-blog-ingest.mjs
